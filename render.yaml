# render.yaml
services:
  # Backend Service
  - type: web
    name: pdf-reader-backend
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: pdf-reader-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: pdf-reader-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: pdf-reader-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: pdf-reader-db
          property: database
      - key: DB_PORT
        fromDatabase:
          name: pdf-reader-db
          property: port
      - key: PORT
        value: 5000

  # Frontend Service
  - type: web
    name: pdf-reader-frontend
    env: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://pdf-reader-backend-c1zn.onrender.com/api

# Database (Native PostgreSQL)
databases:
  - name: pdf-reader-db
    plan: free
    databaseName: bookreader
    user: bookreader_user
